# Review 5, third pilot (docs/REVIEW_5.md 2.8). Exploratory, three
# development seeds, no decision. The "life" setting: a device changes
# between a good and a poor state over the day, link drops grow with job
# time, every job pays for the model download, energy follows the work, the
# server stops waiting at the deadline. Questions:
#  1. Is there more room here for a scheduler than in the current world?
#     (the o_* arms are oracles: bounds, never methods)
#  2. Does the ARL term move the method here? (the method as tuned, with
#     only the damage term changed, as in the planned ARL screen; trained
#     from scratch in each run, so this can only show a strong effect)
# Every tuned setting was tuned in the current world.
# Runner: scripts/screen_rl2.py.
version: 1
title: Review 5 life pilot (devices that change over the day; exploratory)
purpose: dev
source_plan: configs/sweep_advanced.yaml
datasets: {femnist: s2_femnist}
tuned: configs/rl2_tuned_cost.json
set: {data.split: persistent}          # development pool
rounds: 200
seeds: [400, 401, 402]
settings:
  life:
    system.state_model: diurnal
    system.drop_model: exposure
    system.drop_ref_time: 1.0
    system.job_overhead: 1.0
    system.job_overhead_time: 0.05
    system.energy_by_work: true
    system.cap_latency: true
budgets: {life: 3267}                  # 1,400 x (cost of a round of Light jobs) / 7.5
arms:
  light: {tuned_file: configs/rl2_tuned_rl_light_mimic.json}            # the tuned control
  o_light: {condition: o_light_mimic}                                   # bound: Light, no wasted job
  o_work: {condition: o_work_mimic}                                     # bound: heaviest job that finishes
  o_cov: {condition: o_cov_mimic}                                       # bound: contribution-aware picks
  plain: {tuned: true, override: {reward.damage_metric: raw_fail, policy.per_client_credit: false}}
  arl3: {tuned: true, override: {reward.damage_metric: arl_v3, policy.per_client_credit: true}}
  arl4: {tuned: true, override: {reward.damage_metric: arl_v4, policy.per_client_credit: true}}
  fairq: {tuned_file: configs/rl2_tuned_b_fairq_ew_mimic.json}          # mixed-mode comparator
rule:
  kind: describe
  reference: light
  bounds: [o_light, o_work, o_cov]
  targets: [0.60, 0.70, 0.75]
out: results/r5_life
