# Advanced sweep, MNIST: 100 clients, 10 per round (10% participation).
# Same reward and policy settings as configs/mnist.yaml, so the only changes
# from the original Chapter 5 runs are scale and the per-condition overrides
# in configs/sweep_advanced.yaml.
tag: adv_mnist
seed: 0
out: results/adv
data:
  dataset: mnist
  num_clients: 100
  dirichlet_alpha: 0.3
  min_samples: 50
  max_samples: 500
fl:
  rounds: 100
  clients_per_round: 10
  lr: 0.05
  batch_size: 32
  mu: 0.01
  aggregator: fedprox
  model: cnn
  device: auto
system:
  # Mean client "looks like" 500 samples to the simulator, matching the
  # original N=30 config (100-900 samples), so mode/deadline separation is
  # the same as in the pilot results.
  work_ref_samples: 500
reward:
  alpha: 1.0
  beta: 0.1
  delta: 0.1
  lambda_arl: 0.5
  lambda_fair: 0.3
policy:
  name: rl
  elig_threshold: 0.5
