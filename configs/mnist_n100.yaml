# Scalability ablation (docs/EXPERIMENT_PLAN.md item 4): does the framework
# still hold at a larger client population? K is held at 5 (not scaled up with
# N), so this also stress-tests fairness under a harder 5% participation rate
# instead of the base config's 17% -- the more interesting question for a
# fairness-focused thesis is whether starvation gets worse as more clients
# compete for the same K slots, not whether accuracy still converges.
#
# min_samples/max_samples are lowered from the N=30 config (100-900) so 100
# clients' total demand stays comfortably under MNIST's 60k training images.
tag: mnist_n100_rl_fedprox
seed: 0
out: results
data:
  dataset: mnist
  num_clients: 100
  dirichlet_alpha: 0.3
  min_samples: 50
  max_samples: 300
fl:
  rounds: 100
  clients_per_round: 5
  lr: 0.05
  batch_size: 32
  mu: 0.01
  aggregator: fedprox
  model: cnn
reward:
  alpha: 1.0
  beta: 0.1
  delta: 0.1
  lambda_arl: 0.5
  lambda_fair: 0.3
policy:
  name: rl
  elig_threshold: 0.5
