# Advanced sweep, CIFAR-10: colour images, ~190k-param CNN, 200 rounds.
# Per-round accuracy is measured on a fixed 2,000-image test subset to keep
# CPU runs affordable; the final round is always scored on all 10,000.
tag: adv_cifar10
seed: 0
out: results/adv
data:
  dataset: cifar10
  num_clients: 100
  dirichlet_alpha: 0.3
  min_samples: 50
  max_samples: 600
fl:
  rounds: 200
  clients_per_round: 10
  lr: 0.05
  batch_size: 32
  mu: 0.01
  aggregator: fedprox
  model: cnn_cifar
  device: auto
  eval_subset: 2000
system:
  work_ref_samples: 500
reward:
  alpha: 1.0
  beta: 0.1
  delta: 0.1
  lambda_arl: 0.5
  lambda_fair: 0.3
policy:
  name: rl
  elig_threshold: 0.5
